[package]
name = "render-core"
version = "0.1.0"
edition = "2021"
description = "WZRD realtime additive projection-mapping engine (Phase 2 skeleton)."
rust-version = "1.85"

[[bin]]
name = "render-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
notify = "6.1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
wgpu = "22"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
