[package]
name = "render-core"
version = "0.1.0"
edition = "2021"
description = "WZRD realtime additive projection-mapping engine."
rust-version = "1.85"

[lib]
name = "render_core"
path = "src/lib.rs"

[[bin]]
name = "render-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
env_logger = "0.11"
naga = { version = "22", features = ["wgsl-in"] }
notify = "6.1"
pollster = "0.4"
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tungstenite = "0.21"
wgpu = "22"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
