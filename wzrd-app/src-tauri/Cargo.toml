[package]
name = "wzrd-app"
version = "0.1.0"
description = "Phase 4 Tauri shell for WZRD render-core."
edition = "2021"
rust-version = "1.85"

[lib]
name = "wzrd_app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wzrd-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
env_logger = "0.11"
log = "0.4"
render-core = { path = "../../render-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `unstable` unlocks tauri::window::WindowBuilder — the raw (webview-less)
# engine-output window the in-process render thread draws to (collapse Step 2).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# NSWindow.occlusionState polling — tao has no Occluded event (collapse
# Step 2 spike result), so the render thread polls AppKit directly.
# objc2-foundation supplies NSRect/NSPoint for the preview-window
# placement math (AppKit convertRectToScreen — see engine.rs).
objc2 = "0.5"
objc2-foundation = "0.2"
# The preview underlay view's handle for wgpu::Instance::create_surface.
raw-window-handle = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Dev builds: optimize dependencies so `pnpm tauri dev` is representative for
# perf (unoptimized wgpu/naga/image made the preview JPEG cost ~24 ms/frame).
# render-core is a path dependency, so "*" covers it; the specific entry wins
# — opt-level 1 keeps engine edits rebuilding reasonably fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.render-core]
opt-level = 1
